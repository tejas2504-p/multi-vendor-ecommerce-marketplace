services:
  - type: web
    name: nexusmarket-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ELASTICSEARCH_NODE
        sync: false
      - key: ELASTICSEARCH_INDEX
        value: marketplace_products
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MERCHANT_UPI_VPA
        value: tejasprajapati2504@oksbi
      - key: MERCHANT_NAME
        value: NexusMarket
